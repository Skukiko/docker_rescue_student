server {
    listen 80;
    server_name _;
    server_tokens off;   # no revelar la versión de Nginx

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Resolver DNS embebido de Docker: el nombre se resuelve en cada petición
        # (no al arrancar), así Nginx inicia aunque el backend no exista todavía.
        resolver 127.0.0.11 valid=10s ipv6=off;
        # BACKEND_HOST/BACKEND_PORT se sustituyen con envsubst al iniciar el contenedor.
        set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
        # Con proxy_pass por variable se quita el prefijo /api/ a mano.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
